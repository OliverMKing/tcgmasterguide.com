<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- TCG Master Guide mark: two fanned trading cards. Matches src/components/Logo.tsx. -->
  <style>
    .back { fill: #2d1b4e; }
    .front { fill: #b8246f; }
    .window { fill: #f2f0f5; }
    @media (prefers-color-scheme: dark) {
      .back { fill: #a597c2; }
      .front { fill: #ff6fb0; }
      .window { fill: #15101e; }
    }
  </style>
  <rect class="back" x="11" y="4" width="15" height="21" rx="2.5" transform="rotate(13 18.5 14.5)"/>
  <rect class="front" x="6" y="7" width="15" height="21" rx="2.5" transform="rotate(-7 13.5 17.5)"/>
  <rect class="window" x="9" y="11" width="9" height="8" rx="1" transform="rotate(-7 13.5 17.5)" opacity="0.9"/>
</svg>
